x-airflow-common: &airflow-common
  build:
    context: ./airflow
  image: moneywise-airflow:3.3.2
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Chihuahua
    AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY:?falta AIRFLOW_FERNET_KEY en .env}"
    AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW_JWT_SECRET:?falta AIRFLOW_JWT_SECRET en .env}"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?falta AIRFLOW_DB_PASSWORD en .env}@airflow-postgres/airflow"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
    MW_REINTENTO_MINUTOS: ${MW_REINTENTO_MINUTOS:-2}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./data:/opt/airflow/data:ro
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: mw-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_CLIENT_PORT}
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "${ZOOKEEPER_CLIENT_PORT}:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: mw-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: ${KAFKA_BROKER_ID}
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  mysql:
    image: mysql:8.0
    container_name: mw-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --server-id=${MYSQL_SERVER_ID}
      - --log-bin=mysql-bin
      - --binlog-format=${MYSQL_BINLOG_FORMAT}
      - --binlog-row-image=FULL
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  connect:
    image: quay.io/debezium/connect:3.6
    container_name: mw-connect
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: ${CONNECT_GROUP_ID}
      CONFIG_STORAGE_TOPIC: ${CONNECT_CONFIG_STORAGE_TOPIC}
      OFFSET_STORAGE_TOPIC: ${CONNECT_OFFSET_STORAGE_TOPIC}
      STATUS_STORAGE_TOPIC: ${CONNECT_STATUS_STORAGE_TOPIC}
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      RAILWAY_MYSQL_HOST: ${RAILWAY_MYSQL_HOST}
      RAILWAY_MYSQL_PORT: ${RAILWAY_MYSQL_PORT}
      RAILWAY_MYSQL_USER: ${RAILWAY_MYSQL_USER}
      RAILWAY_MYSQL_PASSWORD: ${RAILWAY_MYSQL_PASSWORD}
    ports:
      - "${CONNECT_REST_PORT}:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  spark:
    image: quay.io/jupyter/pyspark-notebook:spark-4.2.0
    container_name: mw-spark
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-moneywise}
      JAVA_TOOL_OPTIONS: -Djava.net.preferIPv4Stack=true
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:4040:4040"
    volumes:
      - ./spark:/home/jovyan/work/spark
      - ./data:/home/jovyan/work/data
      - ./anomalies:/home/jovyan/work/anomalies


  airflow-postgres:
    image: postgres:16
    container_name: mw-airflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: "${AIRFLOW_DB_PASSWORD:?falta AIRFLOW_DB_PASSWORD en .env}"
      POSTGRES_DB: airflow
    volumes:
      - airflow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow", "-d", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  airflow-init:
    <<: *airflow-common
    container_name: mw-airflow-init
    entrypoint: ["/bin/bash", "-c"]
    command: ["exec /entrypoint airflow db migrate"]
    depends_on:
      airflow-postgres:
        condition: service_healthy

  airflow-api-server:
    <<: *airflow-common
    container_name: mw-airflow-api
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        python -c "import json, os; json.dump({'admin': os.environ['AIRFLOW_ADMIN_PASSWORD']}, open('/opt/airflow/passwords.json', 'w'))"
        exec /entrypoint airflow api-server
    environment:
      <<: *airflow-env
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/passwords.json
      AIRFLOW_ADMIN_PASSWORD: "${AIRFLOW_ADMIN_PASSWORD:?falta AIRFLOW_ADMIN_PASSWORD en .env}"
    ports:
      - "127.0.0.1:8085:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    container_name: mw-airflow-dag-processor
    restart: unless-stopped
    command: dag-processor
    depends_on:
      airflow-api-server:
        condition: service_healthy

  # Solo el scheduler recibe el socket de Docker: con LocalExecutor las tareas corren aquí
  # y necesitan `docker exec mw-spark ...`. La API y el procesador de DAGs no lo reciben.
  airflow-scheduler:
    <<: *airflow-common
    container_name: mw-airflow-scheduler
    restart: unless-stopped
    command: scheduler
    environment:
      <<: *airflow-env
      GCS_BUCKET: "${GCS_BUCKET:-}"
      GCP_PROJECT_ID: "${GCP_PROJECT_ID:-}"
      GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/gcp/credentials/service-account.json
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./data:/opt/airflow/data:ro
      - ./gcp:/opt/airflow/gcp:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      airflow-api-server:
        condition: service_healthy
volumes:
  mysql_data:
  kafka_data:
  zookeeper_data:
  zookeeper_log:
  airflow_pg_data: