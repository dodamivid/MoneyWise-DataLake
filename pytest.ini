[pytest]
testpaths = tests
addopts = -ra --tb=short -m "not fuente and not bigquery"
markers =
    fuente: compara el lago contra la base real en Railway (solo lectura; necesita RAILWAY_MYSQL_* en el .env)
    bigquery: compara las tablas de BigQuery contra el lago (solo lectura; necesita BQ_DATASET y credenciales en el .env)
